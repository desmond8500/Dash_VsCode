# Publishes a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Installed copies of Dash Lite pick it up through their automatic update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Dash Lite ${GITHUB_REF_NAME#v}" \
            --generate-notes
